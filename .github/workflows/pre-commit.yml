name: pre-commit

# Runs all pre-commit hooks. This is executed here rather than on pre-commit.ci
# because fix-npm-groovy-lint needs a Java runtime, which npm-groovy-lint
# downloads from api.adoptium.net on first run. pre-commit.ci provides no Java
# toolchain and blocks network access during hook execution, so the hook cannot
# run there. GitHub Actions provides Java via actions/setup-java.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: pre-commit/action@v3.0.1
